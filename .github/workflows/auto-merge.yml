# based on https://github.com/TeX-Live/setup-texlive-action/blob/main/.github/workflows/dependabot.yml
name: auto merge

on:
  workflow_run:
    workflows: ['brew test-bot']
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Dump event sender
        env:
          SENDER: ${{ github.event.sender }}
        run:
          echo "$SENDER"

      - name: Dump full event payload
        env:
          EVENT: ${{ toJSON(github.event) }}
        run:
          echo "$EVENT"

      - name: Try to merge
        # trick actionlint's "Constant conditions at `if:`" check
        # https://github.com/rhysd/actionlint/blob/v1.7.12/docs/checks.md#constant-conditions-at-if
        if: |
          contains(
            fromJSON('["github-actions[bot]", "dependabot[bot]"]'),
            github.event.sender.login
          )
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        # gh docs: https://cli.github.com/manual/gh_pr_merge
        run: >-
          gh pr merge --squash --delete-branch "${PR}"

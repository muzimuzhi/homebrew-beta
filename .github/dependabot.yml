version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: Homebrew/actions/*
    commit-message:
      prefix: ci

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    allow:
      - dependency-name: Homebrew/actions/*
    groups:
      homebrew-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
